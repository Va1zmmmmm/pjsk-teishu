name: Deploy pjsk-teishu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时由这一步自动开启（需要 workflow 的 pages: write 权限）
          enablement: true
          # 自定义域名：Actions 发布的站点**不读仓库根目录的 CNAME 文件**，
          # 必须在这里声明，否则 Pages 的 cname 一直是 null（2026-09-19 实测踩到）
          cname: va1z.xyz

      - name: Copy web/ to site root
        shell: bash
        run: |
          mkdir -p _site
          cp -r web/. _site/
          # 自定义域名必须落在**产物根目录**里：Actions 发布的站点认产物内的 CNAME，
          # 仓库根目录的 CNAME 文件不进产物、不生效（2026-09-19 实测踩到）
          echo "va1z.xyz" > _site/CNAME
          echo "=== _site 内容 ==="
          find _site -type f | sort
          echo "=== web 源内容 ==="
          find web -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
